# The pytest suite of the orch package. scripts/test/orch_py_test.sh runs it,
# with xdist and a --basetemp of its own; from this folder, `python3 -m pytest`
# runs it directly (`-k <name>` for one test, `-n <workers>` for xdist).
[pytest]
testpaths = tests
pythonpath = .
timeout = 60
addopts = -p no:cacheprovider
