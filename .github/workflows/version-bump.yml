name: version-bump

# On every push to main, folds the durations fragments of scripts/test/durations.d/
# into the durations file with scripts/dev/section-durations.sh --fold, then
# gathers the changelog fragments under changelog.d/
# into one version bump with scripts/version-bump.sh, which holds every
# versioning decision. It pushes what either changed as one commit, "Release
# <version>" with a version, "Fold section durations" without. A push
# made with the default GITHUB_TOKEN triggers no workflow, so this never
# loops. No git tag.

on:
  push:
    branches: [main]

permissions:
  contents: write

# One run at a time, and a queued run never cancels the running one.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # A failed fold (a malformed durations fragment line, a failing walk)
      # fails the job before Bump with nothing committed or pushed; the
      # fragments stay on main for the next run.
      - name: Fold durations fragments
        run: scripts/dev/section-durations.sh --fold
      # The script exiting 1 (a malformed fragment, version line or CHANGELOG)
      # fails the job with nothing committed or pushed; the fragments stay on
      # main for the next run, after the fault is fixed.
      - name: Bump
        id: bump
        run: |
          set -euo pipefail
          version="$(scripts/version-bump.sh)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # A push rejected because another merge landed meanwhile exits 0: that
      # merge queued its own run, which takes these fragments. Any other
      # failed push (main has not moved) fails the job.
      - name: Commit and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if [ -z "$VERSION" ] && git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          message="Release $VERSION"
          [ -n "$VERSION" ] || message="Fold section durations"
          git commit -q -m "$message"
          if ! git push origin HEAD:main; then
            git fetch --quiet origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD~1)" ]; then
              echo "Push failed and main has not moved." >&2
              exit 1
            fi
            echo "Push rejected: a newer merge's run takes the fragments."
          fi
