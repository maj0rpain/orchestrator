name: test

# A PR runs the whole suite once, in the autopilot container, as 4 jobs of
# ORCH_TEST_SHARD groups plus one gate job; a push to main runs it unsplit on
# the runner. The changelog fragment rule lives in fragment.yml. The grouping
# and the suite list live in the scripts: this file is wiring only.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A newer run for the same PR cancels this workflow's older in-progress run; a
# push to main has a group of its own per commit and is never cancelled.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A push to main: the whole suite on the runner's own tools, unsplit, so
  # drift on that side is seen within one merge. The container suite does not
  # run on a push.
  runner:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify
        run: scripts/test/all.sh

  # A PR: the whole suite on the autopilot image's own tools (jq 1.6,
  # bookworm's mawk, git 2.39, its shellcheck), so tool-version drift and
  # environment leaks are caught on the PR rather than in an autopilot run, as
  # 4 jobs, each one ORCH_TEST_SHARD group. It runs the runner's checkout, not
  # the image's baked-in copy, which has no .git.
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Every build below reads this one value, so the extra builds reuse the
    # first build's cached apt layer.
    env:
      APT_PACKAGES: shellcheck
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the autopilot image
        run: >-
          docker build -f docker/Dockerfile
          --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES"
          -t orchestrator-autopilot .
      # The EXTRA_BUILD_COMMAND hook checks run in group 1 only: a root-installed
      # artifact in a system path is usable by orch, and a failure anywhere in
      # the command fails the build on the step's own failure line. The apt
      # layer is cached from above.
      - name: Build with EXTRA_BUILD_COMMAND
        if: matrix.shard == 1
        run: >-
          docker build -f docker/Dockerfile
          --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES"
          --build-arg "EXTRA_BUILD_COMMAND=printf ok > /usr/local/share/orch-extra-build"
          -t orchestrator-autopilot-extra .
      - name: EXTRA_BUILD_COMMAND output is usable by orch
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint sh orchestrator-autopilot-extra \
            -c 'id -un; cat /usr/local/share/orch-extra-build')"
          test "$out" = "$(printf 'orch\nok')"
      - name: A failing EXTRA_BUILD_COMMAND fails the build
        if: matrix.shard == 1
        run: |
          set -uo pipefail
          for cmd in 'false | true' 'false; true'; do
            if out="$(docker build -f docker/Dockerfile \
                --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES" \
                --build-arg "EXTRA_BUILD_COMMAND=$cmd" \
                -t orchestrator-autopilot-fail . 2>&1)"; then
              echo "build with '$cmd' passed" >&2; exit 1
            fi
            grep -q 'build failed: EXTRA_BUILD_COMMAND' <<<"$out" \
              || { echo "no step failure line for '$cmd'" >&2; echo "$out" >&2; exit 1; }
          done
      # CHANGELOG_BASE stays unset: fragment.yml enforces the changelog
      # fragment rule. ORCH_SH is already set by the image.
      - name: Verify in the container
        env:
          ORCH_TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          docker run --rm --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -v "$tmp_home:/tmp/home" \
            -e HOME=/tmp/home \
            -e ORCH_AUTOPILOT=1 \
            -e ORCH_MODEL=opus \
            -e ORCH_MODEL_IMPLEMENTER=sonnet \
            -e ORCH_EFFORT=high \
            -e ORCH_TEST_SHARD \
            orchestrator-autopilot scripts/test/all.sh

  # The one result for a PR's suite: passes only when all four groups did, and
  # runs whether or not they passed.
  suite:
    if: always() && github.event_name == 'pull_request'
    needs: container
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        env:
          RESULT: ${{ needs.container.result }}
        run: test "$RESULT" = success
