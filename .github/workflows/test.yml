name: test

# A PR runs the whole suite once, in the autopilot container, as 4 jobs of
# ORCH_TEST_SHARD groups plus one gate job; a push to main runs it unsplit on
# the runner. The changelog fragment rule lives in fragment.yml. The grouping
# and the suite list live in the scripts: this file is wiring only.
#
# Both jobs that run the suite run it with SIGPIPE ignored (`trap '' PIPE`).
# The ignored disposition is the one that catches write-error bugs, and the PR
# gate must see what main sees, or a failure that depends on the disposition
# passes its PR and turns main red after the merge. The default disposition is
# covered by local runs, where the shell starts at it (a WSL shell may not).
#
# The autopilot image's base-tools layer (apt packages, gh, Claude Code) is
# kept in the repo's GitHub Actions cache. Each of a PR's four groups restores
# it, then still builds the image from the PR's own commit, so only the layer
# the PR did not change is restored. Two jobs write the cache: the push job on
# a push to main, which builds from scratch, and group 4 of a PR run. The cache
# is a speed-up only: a cold, missing or unreadable cache makes a build do the
# layer itself, and a failed write is a warning. The cache address and token
# reach only the builds that read or write it, never the suite step.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# A newer run for the same PR cancels this workflow's older in-progress run; a
# push to main has a group of its own per commit and is never cancelled.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every autopilot image build reads this one value, so every build makes the
# same base-tools layer.
env:
  APT_PACKAGES: shellcheck

jobs:
  # A push to main: the whole suite on the runner's own tools, unsplit, so
  # drift on that side is seen within one merge. The container suite does not
  # run on a push. Its verify step states SIGPIPE ignored itself, so a change
  # in what the runner hands the job cannot move it. The default disposition is
  # covered by local runs, where the shell starts at it (a WSL shell may not).
  runner:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify
        run: |
          trap '' PIPE
          scripts/test/all.sh

  # A push to main: builds the autopilot image from scratch, with no cache
  # read, and writes the base-tools layer to the cache, so every PR's first run
  # starts warm and every merge proves the image builds from nothing. It runs
  # no suite and no hook check, and the suite gate does not need it.
  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Read the cache address and token
        id: cache
        uses: actions/github-script@v8
        with:
          script: |
            for (const k of ["ACTIONS_CACHE_URL", "ACTIONS_RESULTS_URL", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (k === "ACTIONS_RUNTIME_TOKEN" && process.env[k]) core.setSecret(process.env[k]);
              core.setOutput(k, process.env[k] || "");
            }
      - name: Build the autopilot image and write the cache
        env:
          ACTIONS_CACHE_URL: ${{ steps.cache.outputs.ACTIONS_CACHE_URL }}
          ACTIONS_RESULTS_URL: ${{ steps.cache.outputs.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache.outputs.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: ${{ steps.cache.outputs.ACTIONS_CACHE_SERVICE_V2 }}
        run: >-
          docker build -f docker/Dockerfile
          --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES"
          --cache-to type=gha,scope=autopilot,ignore-error=true
          -t orchestrator-autopilot .

  # A PR: the whole suite on the autopilot image's own tools (jq 1.6,
  # bookworm's mawk, git 2.39, its shellcheck), so tool-version drift and
  # environment leaks are caught on the PR rather than in an autopilot run, as
  # 4 jobs, each one ORCH_TEST_SHARD group. It runs the runner's checkout, not
  # the image's baked-in copy, which has no .git. The suite starts with SIGPIPE
  # ignored, set inside the container (the docker CLI's disposition does not
  # reach it), so this gate sees what the runner job sees on main. The default
  # disposition is covered by local runs, where the shell starts at it (a WSL
  # shell may not).
  container:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read the cache address and token
        id: cache
        uses: actions/github-script@v8
        with:
          script: |
            for (const k of ["ACTIONS_CACHE_URL", "ACTIONS_RESULTS_URL", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (k === "ACTIONS_RUNTIME_TOKEN" && process.env[k]) core.setSecret(process.env[k]);
              core.setOutput(k, process.env[k] || "");
            }
      # Every group restores the base-tools layer from the cache; the build
      # itself still runs from this commit. Groups 1 to 3 only read.
      - name: Build the autopilot image
        if: matrix.shard != 4
        env:
          ACTIONS_CACHE_URL: ${{ steps.cache.outputs.ACTIONS_CACHE_URL }}
          ACTIONS_RESULTS_URL: ${{ steps.cache.outputs.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache.outputs.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: ${{ steps.cache.outputs.ACTIONS_CACHE_SERVICE_V2 }}
        run: >-
          docker build -f docker/Dockerfile
          --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES"
          --cache-from type=gha,scope=autopilot
          -t orchestrator-autopilot .
      # Group 4 reads and writes; with the layer already cached its write
      # uploads next to nothing. A failed write is a warning.
      - name: Build the autopilot image and write the cache
        if: matrix.shard == 4
        env:
          ACTIONS_CACHE_URL: ${{ steps.cache.outputs.ACTIONS_CACHE_URL }}
          ACTIONS_RESULTS_URL: ${{ steps.cache.outputs.ACTIONS_RESULTS_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache.outputs.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_SERVICE_V2: ${{ steps.cache.outputs.ACTIONS_CACHE_SERVICE_V2 }}
        run: >-
          docker build -f docker/Dockerfile
          --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES"
          --cache-from type=gha,scope=autopilot
          --cache-to type=gha,scope=autopilot,ignore-error=true
          -t orchestrator-autopilot .
      # The EXTRA_BUILD_COMMAND hook checks run in group 1 only: a root-installed
      # artifact in a system path is usable by orch, and a failure anywhere in
      # the command fails the build on the step's own failure line. These
      # builds hold no cache address or token and read no cache: they reuse the
      # base-tools layer the main build left on group 1's own runner.
      - name: Build with EXTRA_BUILD_COMMAND
        if: matrix.shard == 1
        run: >-
          docker build -f docker/Dockerfile
          --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES"
          --build-arg "EXTRA_BUILD_COMMAND=printf ok > /usr/local/share/orch-extra-build"
          -t orchestrator-autopilot-extra .
      - name: EXTRA_BUILD_COMMAND output is usable by orch
        if: matrix.shard == 1
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint sh orchestrator-autopilot-extra \
            -c 'id -un; cat /usr/local/share/orch-extra-build')"
          test "$out" = "$(printf 'orch\nok')"
      - name: A failing EXTRA_BUILD_COMMAND fails the build
        if: matrix.shard == 1
        run: |
          set -uo pipefail
          for cmd in 'false | true' 'false; true'; do
            if out="$(docker build -f docker/Dockerfile \
                --build-arg "EXTRA_APT_PACKAGES=$APT_PACKAGES" \
                --build-arg "EXTRA_BUILD_COMMAND=$cmd" \
                -t orchestrator-autopilot-fail . 2>&1)"; then
              echo "build with '$cmd' passed" >&2; exit 1
            fi
            grep -q 'build failed: EXTRA_BUILD_COMMAND' <<<"$out" \
              || { echo "no step failure line for '$cmd'" >&2; echo "$out" >&2; exit 1; }
          done
      # CHANGELOG_BASE stays unset: fragment.yml enforces the changelog
      # fragment rule. ORCH_SH is already set by the image.
      - name: Verify in the container
        env:
          ORCH_TEST_SHARD: ${{ matrix.shard }}/4
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          docker run --rm --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -v "$tmp_home:/tmp/home" \
            -e HOME=/tmp/home \
            -e ORCH_AUTOPILOT=1 \
            -e ORCH_MODEL=opus \
            -e ORCH_MODEL_IMPLEMENTER=sonnet \
            -e ORCH_EFFORT=high \
            -e ORCH_TEST_SHARD \
            orchestrator-autopilot -c "trap '' PIPE; exec scripts/test/all.sh"

  # The one result for a PR's suite: passes only when all four groups did, and
  # runs whether or not they passed, but not when the run was cancelled.
  suite:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: container
    runs-on: ubuntu-latest
    steps:
      - name: Every group passed
        env:
          RESULT: ${{ needs.container.result }}
        run: test "$RESULT" = success
