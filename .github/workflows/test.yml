name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # contents: read for the checkout; pull-requests: read for the PR's
    # labels, which "Read main's commit" reads live; issues: read for
    # docs_lint.sh's fragment rule, which looks up the fragment's issue's parent.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so docs_lint.sh's fragment rule finds the merge-base
          # with main.
          fetch-depth: 0
      # Sets CHANGELOG_BASE, main's commit, for docs_lint.sh's changelog
      # fragment rule on every PR to main, and NO_VERSION_BUMP=1 when the PR
      # carries the no-version-bump label, which waives only its one-fragment
      # part. The labels are the PR's as they stand now, read with gh, not the
      # event payload's snapshot: gh pr create --label adds them in a mutation
      # after the PR opens, so the opened run's payload can lack a label the
      # PR has (#1299). A failed fetch or read fails the job rather than
      # leaving it unset.
      - name: Read main's commit
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          base="$(git rev-parse --verify origin/main)"
          echo "CHANGELOG_BASE=$base" >>"$GITHUB_ENV"
          labels="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if grep -qxF no-version-bump <<<"$labels"; then
            echo "NO_VERSION_BUMP=1" >>"$GITHUB_ENV"
          fi
      # GH_TOKEN for docs_lint.sh's fragment rule, whose gh api call reads the
      # fragment's issue to check it is no sub-issue.
      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/test/all.sh

  # The whole suite on the autopilot image's own tools (jq 1.6, bookworm's
  # mawk, git 2.39, its shellcheck), so tool-version drift and environment
  # leaks are caught on the PR rather than in an autopilot run. It runs the
  # runner's checkout, not the image's baked-in copy, which has no .git.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the autopilot image
        run: >-
          docker build -f docker/Dockerfile
          --build-arg EXTRA_APT_PACKAGES=shellcheck
          -t orchestrator-autopilot .
      # CHANGELOG_BASE stays unset: the host job enforces the changelog
      # fragment rule. ORCH_SH is already set by the image.
      - name: Verify in the container
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          docker run --rm --entrypoint bash \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            -v "$tmp_home:/tmp/home" \
            -e HOME=/tmp/home \
            -e ORCH_AUTOPILOT=1 \
            -e ORCH_MODEL=opus \
            -e ORCH_MODEL_IMPLEMENTER=sonnet \
            -e ORCH_EFFORT=high \
            orchestrator-autopilot scripts/test/all.sh
